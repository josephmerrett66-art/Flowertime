<title>Flower Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..900,0..100,0..1;1,9..144,400..800,0..100,0..1&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: a storybook corner shop on a sunlit wooden table. Shopfront across the top,
   the player's raised garden bed and potting bench below, the market stall and dice tray beside. */
:root{
  --green:#2E5B3B; --green-deep:#1E3E28; --green-soft:#4E7E57;
  --cream:#FBF3E1; --cream-2:#F1E2C3; --paper:#FFFBF1;
  --wood:#A46A3B; --wood-light:#C8925F; --wood-dark:#6A3F21; --wood-deep:#4A2A14;
  --soil:#3A2416; --soil-2:#55361F;
  --water:#4A8CC6; --water-deep:#2E6CA0; --water-pale:#DCEBF7;
  --gold:#E2A92F; --gold-deep:#A87312; --silver:#C9CFD4;
  --ink:#2C2118; --ink-soft:#6B5643; --chalk:#2C3530; --chalk-ink:#F3F0E6;
  --red:#B8323B; --focus:#F4C542;
  --display:'Fraunces','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --body:'Nunito','Avenir Next','Segoe UI',system-ui,sans-serif;
  --hand:'Caveat','Bradley Hand','Segoe Print',cursive;
  --r:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
html,body{overflow-x:clip}
body{
  margin:0; color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.45;
  background-color:var(--wood);
  background-image:
    radial-gradient(120% 80% at 12% -10%, rgba(255,214,140,.55), rgba(255,214,140,0) 55%),
    radial-gradient(80% 60% at 100% 110%, rgba(60,30,10,.45), rgba(60,30,10,0) 60%),
    repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 158px, rgba(50,25,8,.32) 158px 160px, rgba(255,230,190,.12) 160px 161px),
    var(--grain, none);
  background-attachment:fixed;
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.wrap{max-width:1320px;margin:0 auto;padding-inline:max(16px,2vw);padding-block:14px 40px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.defs{position:absolute;width:0;height:0;overflow:hidden}

/* ---------- shared bits ---------- */
.btn{
  --b:var(--cream); --t:var(--ink);
  appearance:none;border:0;cursor:pointer;font-family:var(--body);font-weight:800;font-size:15px;letter-spacing:.01em;
  padding:11px 20px;border-radius:999px;background:var(--b);color:var(--t);
  box-shadow:0 2px 0 rgba(0,0,0,.18), inset 0 -3px 0 rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.6);
  transition:transform .15s ease, box-shadow .15s ease, filter .15s;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;
}
.btn:hover{transform:translateY(-1px);filter:brightness(1.04)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.18), inset 0 -1px 0 rgba(0,0,0,.12)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;filter:saturate(.6)}
.btn.primary{--b:var(--green);--t:var(--cream)}
.btn.gold{--b:linear-gradient(#F3C454,#D99A1E);--t:#3B2508}
.btn.ghost{--b:rgba(251,243,225,.16);--t:var(--cream);box-shadow:inset 0 0 0 2px rgba(251,243,225,.5)}
.btn.small{padding:7px 14px;font-size:13px;min-height:36px}
.btn.big{font-size:18px;padding:14px 30px;min-height:54px}
.icon-btn{appearance:none;border:0;cursor:pointer;width:42px;height:42px;border-radius:50%;background:var(--cream);color:var(--green-deep);display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.2), inset 0 -3px 0 rgba(0,0,0,.1)}
.icon-btn svg{width:22px;height:22px}
.icon-btn[aria-pressed="true"]{background:var(--gold)}
.paper{background-color:var(--paper);background-image:var(--noise);}
.eyebrow{font-family:var(--body);font-weight:800;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
h1,h2,h3{font-family:var(--display);font-variation-settings:"SOFT" 100,"WONK" 1;text-wrap:balance;margin:0;line-height:1.05}
.hand{font-family:var(--hand)}
.num{font-variant-numeric:tabular-nums}

/* ---------- awning + garland ---------- */
.awning{position:relative;height:64px;margin-inline:-14px;z-index:2;filter:drop-shadow(0 10px 8px rgba(0,0,0,.28))}
.awning::before{content:"";position:absolute;inset:0 0 18px 0;border-radius:10px 10px 0 0;
  background:
    linear-gradient(180deg, rgba(255,255,255,.18), rgba(0,0,0,.12) 70%, rgba(0,0,0,.22)),
    repeating-linear-gradient(90deg, var(--green) 0 44px, var(--cream) 44px 88px);}
.awning::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22px;
  background:
    linear-gradient(180deg, rgba(0,0,0,.18), rgba(0,0,0,0) 60%),
    repeating-linear-gradient(90deg, var(--green) 0 44px, var(--cream) 44px 88px);
  -webkit-mask:radial-gradient(circle at 22px 0, #000 21.5px, transparent 22.5px) 0 0/44px 100% repeat-x;
          mask:radial-gradient(circle at 22px 0, #000 21.5px, transparent 22.5px) 0 0/44px 100% repeat-x;}
.awning .rod{position:absolute;left:-6px;right:-6px;top:-6px;height:10px;border-radius:6px;background:linear-gradient(#6E7A82,#3D464C);box-shadow:0 2px 3px rgba(0,0,0,.3)}
.garland{height:46px;background:var(--garland) repeat-x center/auto 46px;pointer-events:none}

/* ---------- title screen ---------- */
.title-screen{display:grid;gap:0;max-width:1060px;margin:12px auto 0}
.facade{position:relative;background:
   linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,0) 60px),
   repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 2px, rgba(0,0,0,0) 2px 64px),
   var(--green);
  border-radius:0 0 18px 18px;padding:28px clamp(16px,4vw,48px) 30px;color:var(--cream);
  box-shadow:0 30px 50px -20px rgba(30,15,5,.6), inset 0 0 0 6px rgba(0,0,0,.12)}
.signboard{position:relative;margin:4px auto 0;max-width:720px;text-align:center;padding:30px 20px 26px;border-radius:16px;
  background:linear-gradient(180deg,#FFF8E8,#F3E3C2);color:var(--green-deep);
  box-shadow:0 6px 0 #C9AE80, 0 18px 30px -10px rgba(0,0,0,.45), inset 0 0 0 3px #E2CC9E, inset 0 0 0 7px #FFF8E8, inset 0 0 0 8px #CFB27F}
.signboard .garland{position:absolute;left:-18px;right:-18px;top:-26px}
.logo{font-size:clamp(52px,10vw,112px);font-weight:900;letter-spacing:-.02em;color:var(--green);
  font-variation-settings:"SOFT" 100,"WONK" 1,"opsz" 144;text-shadow:0 2px 0 #fff, 0 4px 0 rgba(46,91,59,.18)}
.logo em{font-style:italic;font-weight:600;color:var(--red)}
.tagline{font-family:var(--display);font-style:italic;font-size:clamp(18px,2.6vw,24px);color:var(--ink-soft);margin-top:6px;letter-spacing:.04em}
.boxline{margin-top:10px;font-size:12.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--green-soft)}
.title-row{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:end;margin-top:28px}
.title-shelf{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;border-bottom:16px solid transparent;border-image:linear-gradient(var(--wood-light),var(--wood-dark)) 1;padding-inline:6px;filter:drop-shadow(0 8px 6px rgba(0,0,0,.35))}
.title-shelf > svg{width:100%;height:auto;display:block;overflow:visible}
.title-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:28px}
.chalk-a{position:relative;width:200px;padding:18px 18px 24px;background:var(--chalk);color:var(--chalk-ink);border-radius:8px;
  border:9px solid var(--wood);box-shadow:inset 0 0 30px rgba(0,0,0,.5), 0 14px 20px -8px rgba(0,0,0,.5);
  font-family:var(--hand);font-size:26px;line-height:1.05;text-align:center;transform:rotate(2deg);margin-bottom:22px}
.chalk-a::before,.chalk-a::after{content:"";position:absolute;bottom:-34px;width:9px;height:34px;background:var(--wood-dark);border-radius:3px}
.chalk-a::before{left:16px;transform:rotate(8deg)}.chalk-a::after{right:16px;transform:rotate(-8deg)}
.chalk-a small{display:block;font-size:18px;color:#BFE0C3;margin-top:4px}
.credits{margin-top:20px;text-align:center;color:rgba(251,243,225,.75);font-size:13px}

/* ---------- setup ---------- */
.panel{background:var(--paper);background-image:var(--noise);border-radius:20px;padding:clamp(18px,3vw,32px);box-shadow:0 24px 50px -20px rgba(30,15,5,.6), inset 0 0 0 1px rgba(120,80,40,.15)}
.setup{max-width:980px;margin:22px auto 0}
.setup h2{font-size:clamp(30px,4vw,44px);color:var(--green)}
.setup .lede{color:var(--ink-soft);margin:6px 0 18px;max-width:60ch}
.count-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.chip{appearance:none;border:2px solid var(--cream-2);background:var(--cream);border-radius:999px;padding:8px 18px;font-weight:800;cursor:pointer;min-height:42px}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--cream)}
.seats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.seat{border-radius:16px;padding:14px;background:#fff;box-shadow:inset 0 0 0 2px var(--seat,#ddd), 0 6px 14px -8px rgba(0,0,0,.3);display:grid;gap:10px;min-width:0}
.seat label{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.seat input[type=text]{width:100%;font:700 17px var(--body);padding:9px 12px;border-radius:10px;border:2px solid var(--cream-2);background:var(--paper);color:var(--ink)}
.emblems{display:flex;gap:6px;flex-wrap:wrap}
.emblem-pick{appearance:none;border:0;cursor:pointer;width:42px;height:42px;border-radius:50%;padding:4px;background:var(--tint);box-shadow:inset 0 0 0 2px rgba(0,0,0,.06)}
.emblem-pick[aria-pressed="true"]{box-shadow:0 0 0 3px #fff, 0 0 0 5px var(--pc)}
.emblem-pick svg{width:100%;height:100%}
.who{display:grid;grid-template-columns:1fr 1fr;border-radius:999px;background:var(--cream);padding:3px}
.who button{appearance:none;border:0;background:none;border-radius:999px;padding:7px 8px;font-weight:800;font-size:13px;cursor:pointer;min-height:36px}
.who button[aria-pressed="true"]{background:var(--green);color:var(--cream)}
.setup-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px;align-items:center}

/* ---------- game top bar ---------- */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;color:var(--cream);margin-bottom:10px}
.mini-logo{font-family:var(--display);font-weight:900;font-size:26px;font-variation-settings:"SOFT" 100,"WONK" 1;color:var(--cream);text-shadow:0 2px 0 rgba(0,0,0,.25);display:flex;align-items:center;gap:8px;white-space:nowrap}
.mini-logo svg{width:30px;height:30px}
.round-tag{background:var(--cream);color:var(--green-deep);border-radius:8px 999px 999px 8px;padding:6px 16px 6px 12px;font-weight:900;font-size:14px;box-shadow:0 2px 0 rgba(0,0,0,.2);white-space:nowrap}
.round-tag b{font-family:var(--display);font-size:18px}
.phases{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(30,15,5,.28);box-shadow:inset 0 1px 3px rgba(0,0,0,.3)}
.phase{padding:6px 12px;border-radius:999px;font-weight:800;font-size:13px;color:rgba(251,243,225,.72);display:flex;gap:6px;align-items:center;white-space:nowrap}
.phase i{font-style:normal;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:rgba(251,243,225,.18)}
.phase.on{background:var(--cream);color:var(--green-deep)}
.phase.on i{background:var(--green);color:var(--cream)}
.phase.done{color:var(--cream)}
.phase.done i{background:var(--green-soft)}
.tools{margin-left:auto;display:flex;gap:8px}

.players{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px;margin-bottom:16px}
.pchip{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:rgba(251,243,225,.9);box-shadow:0 3px 0 rgba(0,0,0,.15);min-width:0;position:relative;border:2px solid transparent;transition:transform .2s}
.pchip.now{background:var(--paper);border-color:var(--pc);transform:translateY(-2px);box-shadow:0 6px 14px -4px rgba(0,0,0,.35)}
.pchip .em{width:38px;height:38px;flex:none;border-radius:50%;background:var(--tint);padding:3px;box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--pc)}
.pchip .em svg{width:100%;height:100%}
.pchip .nm{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip .meta{font-size:12px;color:var(--ink-soft);display:flex;gap:8px;flex-wrap:wrap}
.pchip .coins{margin-left:auto;display:flex;align-items:center;gap:4px;font-family:var(--display);font-weight:800;font-size:20px;color:var(--gold-deep)}
.pchip .coins svg{width:20px;height:20px}
.pchip .flag{position:absolute;top:-9px;left:12px;background:var(--pc);color:#fff;font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.pchip .first{position:absolute;top:-9px;right:10px;background:var(--water-deep);color:#fff;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:999px}

/* ---------- shopfront ---------- */
.shop{position:relative;margin-bottom:22px}
.shop .front{position:relative;background:
   linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,0) 40px),
   repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 2px, rgba(0,0,0,0) 2px 64px),
   var(--green);
  border-radius:0 0 16px 16px;padding:14px clamp(10px,2vw,22px) 18px;box-shadow:0 26px 40px -22px rgba(30,15,5,.75), inset 0 0 0 5px rgba(0,0,0,.12)}
.shop-sign{position:relative;margin:2px auto 14px;width:fit-content;max-width:100%;padding:8px 26px;border-radius:10px;background:linear-gradient(#FFF8E8,#F1E0BD);color:var(--green-deep);
  font-family:var(--display);font-weight:700;font-size:clamp(13px,1.6vw,17px);letter-spacing:.16em;text-transform:uppercase;text-align:center;
  box-shadow:0 4px 0 #BFA273, 0 10px 16px -8px rgba(0,0,0,.5), inset 0 0 0 2px #D8BF8D}
.shop-sign .garland{position:absolute;left:-12px;right:-12px;top:-24px;height:36px;background-size:auto 36px}
.slots{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));column-gap:0;row-gap:14px}
.slot{appearance:none;border:0;background:none;padding:0 3px;cursor:pointer;display:grid;justify-items:center;position:relative;color:var(--ink);border-radius:12px;transition:background .2s}
.slot .medal{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#FFFDF4,#F0E0BD);
  font-family:var(--display);font-weight:900;font-size:17px;color:var(--green-deep);box-shadow:0 0 0 2px #C9A96E, 0 3px 4px rgba(0,0,0,.35);z-index:2;margin-bottom:-6px}
.slot .bucket{width:100%;max-width:96px;aspect-ratio:1;position:relative;z-index:1}
.slot .bucket > svg{width:100%;height:100%;display:block;overflow:visible}
.slot .plank{width:calc(100% + 6px);height:13px;background:linear-gradient(var(--wood-light),var(--wood) 55%,var(--wood-dark));box-shadow:0 5px 6px -2px rgba(0,0,0,.45);margin-top:-6px;position:relative;z-index:0}
.slot:first-child .plank{border-radius:4px 0 0 4px}
.slot .tag{margin-top:8px;display:flex;align-items:center;gap:3px;background:var(--cream);padding:2px 9px 2px 6px;border-radius:5px 12px 12px 5px;font-weight:900;font-size:13px;color:var(--ink);position:relative;box-shadow:0 2px 3px rgba(0,0,0,.3)}
.slot .tag::before{content:"";position:absolute;left:50%;top:-9px;width:1px;height:9px;background:rgba(251,243,225,.6)}
.slot .tag svg{width:15px;height:15px}
.slot .odds{display:flex;gap:2px;margin-top:6px;height:5px}
.slot .odds span{width:5px;height:5px;border-radius:50%;background:rgba(251,243,225,.75)}
.slot .worth{position:absolute;top:30px;right:2px;z-index:3;background:var(--pc);color:#fff;font-weight:900;font-size:11px;padding:1px 6px;border-radius:999px;box-shadow:0 2px 3px rgba(0,0,0,.3)}
.slot.target{background:rgba(244,197,66,.18);box-shadow:inset 0 0 0 2px rgba(244,197,66,.7)}
.slot.hover{background:rgba(244,197,66,.38)}
.slot.won .medal{animation:medal 1.2s ease-in-out 2}
.slot.won{background:radial-gradient(circle at 50% 40%, rgba(255,220,120,.6), rgba(255,220,120,0) 70%)}
@keyframes medal{0%,100%{transform:scale(1)}50%{transform:scale(1.35);box-shadow:0 0 0 3px #FFD86B, 0 0 24px 8px rgba(255,216,107,.8)}}
.slot.rolled .medal{background:#FFD86B}

/* ---------- main table grid ---------- */
.play{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,360px);gap:22px;align-items:start}
.left{display:grid;gap:22px;min-width:0}
.right{display:grid;gap:18px;min-width:0}

/* chalkboard */
.board-sign{position:relative;background:var(--chalk);background-image:radial-gradient(120% 80% at 30% 20%,rgba(255,255,255,.07),rgba(0,0,0,0) 60%),var(--noise);
  color:var(--chalk-ink);border-radius:10px;border:10px solid var(--wood);border-image:linear-gradient(135deg,var(--wood-light),var(--wood-dark)) 10;
  padding:12px 16px 14px;font-family:var(--hand);font-size:25px;line-height:1.08;box-shadow:inset 0 0 24px rgba(0,0,0,.6), 0 10px 18px -8px rgba(0,0,0,.5);min-height:96px}
.board-sign .who-turn{font-size:17px;color:#BFE0C3;display:block}
.board-sign .sub{display:block;font-size:19px;color:#E9D79A;margin-top:4px}

/* market */
.market{border-radius:18px;padding:14px;background:
  linear-gradient(rgba(255,251,241,.88),rgba(255,251,241,.88)),
  repeating-linear-gradient(0deg, rgba(46,91,59,.12) 0 12px, rgba(0,0,0,0) 12px 24px),
  repeating-linear-gradient(90deg, rgba(46,91,59,.12) 0 12px, rgba(0,0,0,0) 12px 24px), var(--paper);
  box-shadow:0 18px 30px -16px rgba(30,15,5,.6), inset 0 0 0 1px rgba(120,80,40,.18)}
.sect-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.sect-head h3{font-size:21px;color:var(--green-deep)}
.sect-head .eyebrow{white-space:nowrap}
.spread{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:10px}
.card{appearance:none;border:0;padding:0;cursor:pointer;position:relative;aspect-ratio:5/7;border-radius:11px;width:100%;max-width:100%;
  background:var(--paper);background-image:var(--noise);box-shadow:0 3px 0 rgba(0,0,0,.08), 0 6px 12px -4px rgba(60,30,10,.35), inset 0 0 0 1px rgba(120,80,40,.18);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:7px 5px 6px;touch-action:none;
  transition:transform .2s cubic-bezier(.3,1.5,.5,1), box-shadow .2s;animation:deal .5s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(var(--i,0) * 50ms)}
.card::before{content:"";position:absolute;inset:4px;border-radius:8px;border:1.5px solid rgba(160,110,60,.28);pointer-events:none}
.card:hover{transform:translateY(-4px) rotate(-1.5deg)}
.card.sel{transform:translateY(-6px);box-shadow:0 0 0 3px var(--gold), 0 12px 18px -6px rgba(60,30,10,.5)}
.card .cn{font-family:var(--display);font-weight:800;font-size:12.5px;color:var(--ink);line-height:1}
.card .art{width:84%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%, #fff, var(--tint) 70%);display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.7)}
.card .art svg{width:88%;height:88%}
.card .pips{display:flex;gap:2px;align-items:center}
.card .pips svg{width:9px;height:11px}
.card .val{font-size:10px;font-weight:900;color:var(--ink-soft)}
.card.water{background-color:var(--water-pale);background-image:radial-gradient(circle at 50% 40%,rgba(255,255,255,.8),rgba(255,255,255,0) 60%),var(--noise)}
.card.water .cn{color:var(--water-deep)}
.card.water .art{background:none;box-shadow:none}
.decks{display:flex;gap:12px;align-items:center;margin-top:12px;font-size:12.5px;color:var(--ink-soft);font-weight:700}
.deck-pile{position:relative;width:46px;height:62px;flex:none}

@keyframes splash{0%{filter:brightness(1)}40%{filter:brightness(1.35) saturate(1.3)}100%{filter:brightness(1)}}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(36,20,8,.55);backdrop-filter:blur(3px);animation:fade .25s ease}

.table-scroll{overflow-x:auto}
.house{margin:12px 0 0;padding-left:18px;color:var(--ink-soft);font-size:14px}

.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.field{display:grid;gap:6px;min-width:0}
.field > span{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}

      const m = row.length, span = Math.min(70, 26 * m);
      const x = 50 + (m === 1 ? 0 : (i/(m-1) - .5) * span);

/* ================= rules ================= */
function score(types, s){
  const per = types.map(() => 0), notes = [];
  let base = 0; types.forEach(t => base += +s.base[t] || 0);
  const distinct = new Set(types).size, lav = types.filter(t => t === 'lavender').length;
  const sums = {tulip:0, rose:0, lavender:0, sunflower:0};
  types.forEach((t,i) => {
    const nb = [types[i-1], types[i+1]].filter(Boolean);
    if(t === 'tulip' && nb.length){ per[i] += nb.length; sums.tulip += nb.length; }
    if(t === 'rose' && nb.includes('tulip')){ per[i] += 1; sums.rose += 1; }
    if(t === 'lavender' && lav > 1){ per[i] += lav - 1; sums.lavender += lav - 1; }
    if(t === 'sunflower' && distinct >= 3){ per[i] += 2; sums.sunflower += 2; }
  });
  if(sums.tulip) notes.push({t:`Tulip neighbours +${sums.tulip}`, a:sums.tulip});
  if(sums.rose) notes.push({t:`Rose by tulip +${sums.rose}`, a:sums.rose});
  if(sums.lavender) notes.push({t:`Lavender bunch +${sums.lavender}`, a:sums.lavender});
  if(sums.sunflower) notes.push({t:`Sunny mix +${sums.sunflower}`, a:sums.sunflower});
  const yellow = types.includes('sunflower') ? -1 : 0;
  if(yellow) notes.push({t:'Yellow clash −1', a:-1});
  const bonus = per.reduce((a,b) => a+b, 0);
  return { total: Math.max(0, base + bonus + yellow), base, per, notes };
}

  SLOTS.forEach(n => G.shop[n] = null);

function deal(){

  const empty = p.plots.some(pl => !pl.seed), planted = p.plots.some(pl => pl.seed);

const A = {

    pl.seed = c.type; pl.water = 0; G.grown = true; ui.sel = null; ui.bloomed = plotIdx;

  },
  takeWater(cardId, plotIdx){
    const p = cur(); if(G.grown || G.pending) return 'You have already grown this turn.';
    if(!p.plots.some(pl => pl.seed)) return 'Plant a seed first. Water needs a seedling to go to.';
    const waters = G.spread.filter(c => c.kind === 'water'); if(!waters.length) return 'No water left in the market.';
    const first = waters.find(c => c.id === cardId) || waters[0];

  },
  moveDraft(fid, dir){

function pourInto(p, i){

    toastSoon(`${p.ai ? p.name + "'s" : 'Your'} ${FL[pl.seed].name.toLowerCase()} bloomed!`);

}

function undo(){

/* -------- rolling and the round's end -------- */
async function rollDice(){
  if(G.phase !== 'roll' || ui.rolling) return;
  ui.rolling = true; G.sales = []; G.rolls = [];
  const n = Math.max(1, +G.s.rolls || 1);
  for(let r=0;r<n;r++){
    const a = 1 + rand(6), b = 1 + rand(6), sum = a + b;
    ui.won = null; ui.dice = [a,b]; ui.tumble = true; Snd.dice(); render(); ui.tumble = false;
    await sleep(950);
    ui.lastRoll = sum;
    const e = G.shop[sum];
    if(e){
      const owner = G.players[e.owner];
      owner.coins += e.value; owner.sold++; owner.earned += e.value;
      if(!owner.best || e.value > owner.best.value) owner.best = { value:e.value, flowers:e.flowers };
      G.sales.push({ dice:[a,b], sum, owner:e.owner, value:e.value, flowers:e.flowers });
      G.shop[sum] = null; ui.won = sum; render();
      Snd.bell(); flyCoins(sum, owner.id, e.value);
      log(`Rolled ${sum}: ${owner.name} sold a bouquet for ${e.value}.`);
    } else {
      G.sales.push({ dice:[a,b], sum, owner:null });
      render(); log(`Rolled ${sum}: nothing in that slot.`);
    }
    await sleep(1300);
  }
  ui.rolling = false; ui.won = null;
  G.phase = 'summary'; save(); render();
  ui.modal = { kind:'summary' }; render(); flow();
}
function gameOver(){
  if(G.s.win === 'rounds' && G.round >= +G.s.rounds) return true;
  if(G.s.win === 'money' && G.players.some(p => p.coins >= +G.s.target)) return true;
  if(G.s.win === 'deck' && G.finalRound) return true;
  return false;
}
function nextRound(){

    SLOTS.forEach(n => { const e = G.shop[n]; if(e){ G.players[e.owner].bouquets.push({ id:e.id, flowers:e.flowers }); G.shop[n] = null; } });
  }
  if(gameOver()){ G.phase = 'end'; save(); render(); return; }
  G.round++; G.first = (G.first + 1) % G.players.length; G.turnIdx = 0; G.phase = 'turn';
  G.grown = false; G.pending = 0; G.rents = 0; ui.lastRoll = null;

/* ================= computer players ================= */
function bestOrder(types){
  if(types.length <= 7){
    let best = null, bv = -1;
    const perm = (arr, l) => {
      if(l === arr.length){ const v = score(arr, G.s).total; if(v > bv){ bv = v; best = arr.slice(); } return; }
      const seen = new Set();
      for(let i=l;i<arr.length;i++){ if(seen.has(arr[i])) continue; seen.add(arr[i]); [arr[l],arr[i]]=[arr[i],arr[l]]; perm(arr,l+1); [arr[l],arr[i]]=[arr[i],arr[l]]; }
    };
    perm(types.slice(), 0); return best;
  }
  return types;
}
async function runAI(){
  if(ui.aiBusy) return; ui.aiBusy = true; render();
  const p = cur(); const D = 650;
  await sleep(D);
  // Grow
  const planted = p.plots.filter(pl => pl.seed).length, empty = 8 - planted;
  const seeds = G.spread.filter(c => c.kind === 'seed'), waters = G.spread.filter(c => c.kind === 'water');
  const wantWater = waters.length && planted && (planted >= 3 || (planted >= 2 && Math.random() < .7) || !seeds.length || !empty);
  if(wantWater){
    A.takeWater(waters[0].id); save(); render(); await sleep(D);
    while(G.pending > 0){
      const cands = p.plots.map((pl,i) => ({pl,i})).filter(x => x.pl.seed).sort((a,b) => (G.s.water[a.pl.seed]-a.pl.water) - (G.s.water[b.pl.seed]-b.pl.water));
      if(!cands.length) break;
      pourInto(p, cands[0].i); settleWater(p); save(); render(); await sleep(D*.8);
    }
  } else if(seeds.length && empty){
    const lavOwned = p.stock.concat(p.draft).filter(f => f.type === 'lavender').length + p.plots.filter(pl => pl.seed === 'lavender').length;
    const pick = seeds.map(c => ({c, v:+G.s.base[c.type] + (c.type==='lavender' ? lavOwned*.8 : 0) + (c.type==='tulip' ? 1 : 0) - (+G.s.water[c.type])*.4 + Math.random()*1.5})).sort((a,b) => b.v - a.v)[0].c;
    A.plant(pick.id, p.plots.findIndex(pl => !pl.seed)); save(); render(); await sleep(D);
  } else { G.grown = true; }
  G.grown = true; G.pending = 0;
  // Arrange: tie everything into one bouquet once there are enough blooms
  const min = +G.s.minBouquet;
  const pool = p.stock.concat(p.draft);
  if(pool.length >= Math.max(min, Math.random() < .5 ? min : min + 1) || (pool.length >= min && G.round >= +G.s.rounds - 1)){
    const use = pool.slice(0, 7); const order = bestOrder(use.map(f => f.type));
    const flowers = []; const left = use.slice();
    order.forEach(t => { const k = left.findIndex(f => f.type === t); flowers.push(left.splice(k,1)[0]); });
    p.stock = pool.filter(f => !use.includes(f)); p.draft = [];
    const b = { id:nid(), flowers }; p.bouquets.push(b); ui.fresh.add('b' + b.id);
    log(`${p.name} tied a bouquet.`); save(); render(); await sleep(D);
  }
  // Sell
  const bqs = p.bouquets.map(b => ({b, v:score(b.flowers.map(f=>f.type), G.s).total})).sort((a,b) => b.v - a.v);
  for(const {b, v} of bqs){
    if(+G.s.maxRents > 0 && G.rents >= +G.s.maxRents) break;
    const opts = SLOTS.filter(n => !G.shop[n] && +G.s.rents[n] <= p.coins && +G.s.rents[n] < v)
      .map(n => ({n, e: WAYS[n] / 36 * v * Math.max(1, +G.s.rolls) - +G.s.rents[n] * .6 + Math.random()*.3})).sort((a,b) => b.e - a.e);
    if(!opts.length) continue;
    A.rent(b.id, opts[0].n); save(); render(); await sleep(D);
  }
  ui.aiBusy = false;
  endTurn();
}
function flow(){
  if(!G || ui.screen !== 'game') return;
  if(ui.modal && ui.modal.kind !== 'summary') return;
  if(G.phase === 'turn'){
    const p = cur();
    if(p.ai){ if(!ui.aiBusy) setTimeout(runAI, 250); return; }
    if(humans().length > 1 && ui.lastHuman !== p.id && !ui.modal){ ui.modal = { kind:'curtain' }; render(); return; }
    ui.lastHuman = p.id;
  }
  if(G.phase === 'roll' && !humans().length && !ui.rolling) setTimeout(rollDice, 600);
  if(G.phase === 'summary' && !humans().length) setTimeout(() => { if(G.phase === 'summary') nextRound(); }, 2200);
}

  <button class="icon-btn" data-act="how" aria-label="How to play" title="How to play">${ICON.help}</button>
  <button class="icon-btn" data-act="settings" aria-label="Rules settings" title="Rules settings">${ICON.gear}</button>
  <button class="icon-btn" data-act="sound" aria-pressed="${Snd.on}" aria-label="Sound ${Snd.on?'on':'off'}" title="Sound ${Snd.on?'on':'off'}">${Snd.on?ICON.sound:ICON.mute}</button>
  ${inGame ? `<button class="icon-btn" data-act="menu" aria-label="Back to the shop door" title="Back to the title screen">${ICON.home}</button>` : ''}
</div>`;

function titleHTML(){
  const saved = load();
  const shelf = ['sunflower','tulip','lily','rose','lavender'].map((t,i) => bucketSVG({ flowers:Array.from({length:[4,5,3,5,4][i]}, () => ({type:t})), pc:FL[t].pc }, true)).join('');
  return `<div class="title-screen">
    <div class="topbar" style="justify-content:flex-end">${tools(false)}</div>
    <div class="awning"><span class="rod"></span></div>
    <div class="facade">
      <div class="signboard">
        <div class="garland"></div>
        <div class="eyebrow" style="color:var(--green-soft)">Fresh Flowers · Local Grown · Brighter Days</div>
        <h1 class="logo">Flower <em>Shop</em></h1>
        <div class="tagline">Grow · Arrange · Sell</div>
        <div class="boxline">2–4 players · about 45 minutes · ages 10+</div>
      </div>
      <div class="title-row">
        <div class="title-shelf">${shelf}</div>
        <div class="chalk-a">Good Flowers,<br>Brighter People<small>open today</small></div>
      </div>
      <div class="title-actions">
        ${saved && saved.phase !== 'end' ? `<button class="btn gold big" data-act="continue" data-key="continue">Continue round ${saved.round}</button>` : ''}
        <button class="btn ${saved && saved.phase !== 'end' ? '' : 'gold'} big" data-act="setup" data-key="newgame">New Game</button>
        <button class="btn big ghost" data-act="how" data-key="howbtn">How to Play</button>
      </div>
      <p class="credits">Grow flowers in your garden bed, clip them into bouquets and rent a spot in the shop window. Roll the dice and hope your number comes up.</p>
    </div>
  </div>`;
}

function defaultSeats(){
  return [
    {name:'Joe', emblem:'tulip', ai:false},
    {name:'Marigold', emblem:'sunflower', ai:true},
    {name:'Basil', emblem:'lavender', ai:true},
    {name:'Clementine', emblem:'rose', ai:true},
  ];
}
function setupHTML(){
  const st = ui.setup || (ui.setup = { count:2, seats:defaultSeats() });
  const seats = st.seats.slice(0, st.count).map((s,i) => `
    <div class="seat" style="--seat:${FL[s.emblem].pc}">
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="eyebrow">Seat ${i+1}</span>
        <span style="width:34px;height:34px;border-radius:50%;background:${FL[s.emblem].tint};padding:3px;box-shadow:0 0 0 2px #fff,0 0 0 4px ${FL[s.emblem].pc}">${emblemSVG(s.emblem)}</span></div>
      <label for="seat-name-${i}">Name</label>
      <input type="text" id="seat-name-${i}" data-seat="${i}" value="${esc(s.name)}" maxlength="18" autocomplete="off">
      <span class="eyebrow">Flower</span>
      <div class="emblems" role="group" aria-label="Flower for seat ${i+1}">${KEYS.map(k => `<button class="emblem-pick" style="--tint:${FL[k].tint};--pc:${FL[k].pc}" data-act="emblem" data-seat="${i}" data-arg="${k}" data-key="em${i}${k}" aria-pressed="${s.emblem===k}" aria-label="${FL[k].name}" title="${FL[k].name}">${emblemSVG(k)}</button>`).join('')}</div>
      <div class="who" role="group" aria-label="Who plays seat ${i+1}">
        <button data-act="who" data-seat="${i}" data-arg="human" data-key="wh${i}" aria-pressed="${!s.ai}">Person</button>
        <button data-act="who" data-seat="${i}" data-arg="ai" data-key="wa${i}" aria-pressed="${s.ai}">Computer</button>
      </div>
    </div>`).join('');
  return `<div class="topbar"><div class="mini-logo">${flowerSVG('tulip')}Flower Shop</div>${tools(false)}</div>
  <div class="awning"><span class="rod"></span></div>
  <div class="panel setup" style="margin-top:-4px;border-radius:0 0 20px 20px">
    <h2>Open the shop</h2>
    <p class="lede">Choose how many florists are playing. Pass one device around for people, and let the computer fill any empty seats.</p>
    <div class="count-row" role="group" aria-label="Number of players"><span class="eyebrow">Players</span>
      ${[2,3,4].map(n => `<button class="chip" data-act="count" data-arg="${n}" data-key="cnt${n}" aria-pressed="${st.count===n}">${n}</button>`).join('')}
    </div>
    <div class="seats">${seats}</div>
    <div class="setup-foot">
      <button class="btn" data-act="title">Back</button>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="settings">Rules settings</button><button class="btn primary big" data-act="start" data-key="start">Start the game</button></div>
    </div>
  </div>`;
}

function phaseInfo(){
  if(G.phase === 'roll' || G.phase === 'summary') return 3;
  if(!G.grown) return 0;
  return cur().bouquets.length ? 2 : 1;
}
function hint(){
  const p = cur();
  if(G.phase === 'roll') return { who:'Everyone has set up shop', t: ui.rolling ? 'Rolling…' : 'Roll the dice to see which buckets sell!', sub: G.s.rolls > 1 ? `${G.s.rolls} rolls this round` : '' };
  if(G.phase === 'summary') return { who:'Round over', t:'Counting the till…' };
  if(p.ai) return { who:`${p.name}'s turn`, t:`${p.name} is tending their garden…` };
  if(G.pending) return { who:`${p.name}'s turn`, t:`Pour ${plural(G.pending,'water drop')} onto your seedlings.`, sub:'Drag a drop, or tap a seedling.' };
  if(!G.grown) return canGrow(p) ? { who:`${p.name}'s turn`, t:'Take one seed or two water from the market.', sub:'Drag a card into your garden, or tap it.' } : { who:`${p.name}'s turn`, t:'There is nothing in the market for you.', sub:'Skip growing to carry on.' };
  const min = +G.s.minBouquet;
  if(p.bouquets.length) return { who:`${p.name}'s turn`, t:'Drag a bouquet onto a shop slot to rent it.', sub:'Or end your turn when you are ready.' };
  if(p.draft.length >= min) return { who:`${p.name}'s turn`, t:'Tie the bouquet on your bench.', sub:'Order matters. Neighbours earn bonuses.' };
  if(p.stock.length + p.draft.length >= min) return { who:`${p.name}'s turn`, t:`Clip ${min} or more blooms together on the bench.`, sub:'Tap or drag fresh blooms onto the bench.' };
  return { who:`${p.name}'s turn`, t:'Your flowers are still growing.', sub:'End your turn when you are ready.' };
}

function gameHTML(){
  const p = viewP(), me = isMyTurn() && p === cur();
  const ph = phaseInfo();
  const phases = ['Grow','Arrange','Sell','Collect'].map((n,i) => `<span class="phase ${i===ph?'on':''} ${i<ph?'done':''}"><i>${i<ph?'✓':i+1}</i><span>${n}</span></span>`).join('');
  const roundTxt = G.s.win === 'rounds' ? `Round <b class="num">${G.round}</b> of ${G.s.rounds}` : G.s.win === 'money' ? `Round <b class="num">${G.round}</b> · first to ${G.s.target}` : `Round <b class="num">${G.round}</b>${G.finalRound ? ' · final round' : ''}`;
  const players = G.players.map(pl => {
    const now = G.phase === 'turn' && pl === cur();
    const inShop = SLOTS.filter(n => G.shop[n] && G.shop[n].owner === pl.id).length;
    return `<div class="pchip ${now?'now':''}" style="--pc:${FL[pl.emblem].pc};--tint:${FL[pl.emblem].tint}">
      ${now ? `<span class="flag">${pl.ai ? 'Playing' : 'Your turn'}</span>` : ''}${G.first === pl.id ? '<span class="first">First</span>' : ''}
      <span class="em">${emblemSVG(pl.emblem)}</span>
      <span style="min-width:0"><span class="nm" style="display:block">${esc(pl.name)}${pl.ai ? ' <span style="font-weight:700;color:var(--ink-soft);font-size:12px">computer</span>' : ''}</span>
      <span class="meta"><span>${plural(pl.stock.length + pl.draft.length,'bloom')}</span><span>${inShop} in shop</span></span></span>
      <span class="coins num" aria-label="${pl.coins} coins">${coinSVG()}${pl.coins}</span>
    </div>`;
  }).join('');
  return `
  <div class="topbar">
    <div class="mini-logo">${flowerSVG('tulip')}Flower Shop</div>
    <span class="round-tag">${roundTxt}</span>
    <div class="phases" aria-label="Phase">${phases}</div>
    ${tools(true)}
  </div>
  <section class="players" style="--n:${G.players.length}" aria-label="Players">${players}</section>
  ${shopHTML(me)}
  <div class="play">
    <div class="left">${gardenHTML(p, me)}${benchHTML(p, me)}</div>
    <aside class="right">${signHTML()}${marketHTML(me)}${trayHTML()}${purseHTML(p)}${actionsHTML(me)}</aside>
  </div>`;
}

function shopHTML(me){
  const sel = ui.sel && ui.sel.kind === 'bouquet';
  const coins = cur().coins;
  const slots = SLOTS.map(n => {
    const e = G.shop[n], rent = +G.s.rents[n];
    const target = me && sel && !e && coins >= rent;
    const owner = e ? G.players[e.owner] : null;
    const label = `Slot ${n}. Rent ${rent} coins. ${WAYS[n]} in 36 chance per roll. ${e ? `${owner.name}'s bouquet worth ${e.value}.` : 'Empty.'}`;
    return `<button class="slot ${target?'target':''} ${ui.won===n?'won':''} ${ui.lastRoll===n?'rolled':''}" data-act="slot" data-arg="${n}" data-drop="slot:${n}" data-key="slot${n}" aria-label="${esc(label)}">
      <span class="medal">${n}</span>
      ${e ? `<span class="worth" style="--pc:${e.pc}">${e.value}</span>` : ''}
      <span class="bucket">${bucketSVG(e)}</span>
      <span class="plank"></span>
      <span class="tag">${coinSVG()}${rent}</span>
      <span class="odds" aria-hidden="true">${'<span></span>'.repeat(WAYS[n])}</span>
    </button>`;
  }).join('');
  return `<section class="shop" aria-label="Shopfront">
    <div class="awning"><span class="rod"></span></div>
    <div class="front">
      <div class="shop-sign"><div class="garland"></div>Fresh Flowers · Local Grown · Brighter Days</div>
      <div class="slots">${slots}</div>
    </div>
  </section>`;
}

function gardenHTML(p, me){
  const seedSel = me && ui.sel && ui.sel.kind === 'card';
  const plots = p.plots.map((pl,i) => {
    const need = pl.seed ? +G.s.water[pl.seed] : 0;
    const target = me && ((seedSel && !pl.seed) || (G.pending && pl.seed));
    const label = pl.seed ? `Plot ${i+1}: ${FL[pl.seed].name}, ${pl.water} of ${need} water` : `Plot ${i+1}: empty`;
    return `<button class="plot ${target?'target':''} ${ui.splash===i?'splash':''} ${ui.bloomed===i?'bloom':''}" data-act="plot" data-arg="${i}" data-drop="plot:${i}" data-key="plot${i}" aria-label="${label}">
      ${pl.seed ? `<span class="stake">${FL[pl.seed].name}</span><span class="sprout">${sproutSVG(pl.seed, need ? pl.water/need : 0)}</span>
        <span class="drops">${Array.from({length:need}, (_,k) => dropSVG(k < pl.water)).join('')}</span>` : `<span class="empty">empty</span>`}
    </button>`;
  }).join('');
  const pend = me && G.pending ? `<div class="pending">${Array.from({length:G.pending}, (_,k) => `<button class="drop-token" data-drag="drop" data-key="drop${k}" aria-label="Water drop. Tap a seedling to pour.">${dropSVG(true)}</button>`).join('')}<span>${plural(G.pending,'drop')} to pour</span></div>` : '';
  return `<section class="bed" aria-label="Garden">
    <div class="bed-head"><div class="plaque" style="--pc:${FL[p.emblem].pc}">${emblemSVG(p.emblem)}<span>${esc(p.name)}'s garden</span></div>${pend}</div>
    <div class="plots">${plots}</div>
  </section>`;
}

function benchHTML(p, me){
  const min = +G.s.minBouquet;
  const locked = !me || !G.grown;
  const draftTypes = p.draft.map(f => f.type);
  const sc = score(draftTypes, G.s);
  const stock = p.stock.length ? p.stock.map(f => `<button class="piece ${ui.fresh.has('f'+f.id)?'fresh':''}" data-act="stock" data-arg="${f.id}" data-drag="stock:${f.id}" data-key="s${f.id}" aria-label="${FL[f.type].name}. Add to the bench.">${pieceSVG(f.type)}</button>`).join('')
    : `<span class="empty-note">${p.draft.length || p.bouquets.length ? 'All your blooms are in use.' : 'Blooms from your garden land here.'}</span>`;
  const chain = p.draft.length ? p.draft.map((f,i) => {
    const b = sc.per[i];
    return `<button class="piece ${ui.fresh.has('f'+f.id)?'fresh':''} ${ui.draftSel===f.id?'sel':''}" data-act="draft" data-arg="${f.id}" data-drag="draft:${f.id}" data-drop="draft:${f.id}" data-key="d${f.id}" aria-label="${FL[f.type].name}, position ${i+1}${b?`, bonus ${b}`:''}" aria-pressed="${ui.draftSel===f.id}">${pieceSVG(f.type)}${b ? `<span class="badge">+${b}</span>` : ''}</button>`;
  }).join('') : `<span class="empty-note">Clip at least ${min} blooms together here.</span>`;
  const notes = sc.notes.map(n => `<span class="note ${n.a<0?'neg':''}">${n.t}</span>`).join('');
  const ds = ui.draftSel != null && p.draft.some(f => f.id === ui.draftSel);
  const tied = p.bouquets.map(b => {
    const v = score(b.flowers.map(f=>f.type), G.s).total;
    const sel = ui.sel && ui.sel.kind === 'bouquet' && ui.sel.id === b.id;
    return `<div style="display:grid;gap:6px;justify-items:center">
      <button class="bouquet ${sel?'sel':''} ${ui.fresh.has('b'+b.id)?'fresh':''}" style="width:auto;aspect-ratio:auto" data-act="bouquet" data-arg="${b.id}" data-drag="bouquet:${b.id}" data-key="b${b.id}" aria-pressed="${!!sel}" aria-label="Bouquet of ${b.flowers.length}, worth ${v}. Select, then choose a shop slot.">
        <span class="mini">${b.flowers.map(f => `<span class="piece">${pieceSVG(f.type)}</span>`).join('')}</span>
        <span class="twine">worth ${v}</span>
        <svg class="bow" viewBox="0 0 34 14" aria-hidden="true"><path d="M17 7 C10 0 2 2 4 7 C2 12 10 14 17 7 C24 0 32 2 30 7 C32 12 24 14 17 7Z" fill="#E9DDBF" stroke="#8C6A3C" stroke-width="1"/><circle cx="17" cy="7" r="2.4" fill="#C9B386" stroke="#8C6A3C" stroke-width="1"/></svg>
      </button>
      <button class="btn small" data-act="untie" data-arg="${b.id}" data-key="u${b.id}">Untie</button>
    </div>`;
  }).join('');
  return `<section class="bench" aria-label="Potting bench">
    <div class="bench-grid ${locked && p === cur() && G.phase==='turn' && !p.ai ? '' : ''}">
      <div class="mat ${locked?'locked':''}">
        <div class="mat-head"><h3>Fresh blooms</h3><span class="mat-note">${locked && me ? 'Grow first, then arrange.' : 'Tap or drag a bloom onto the bench.'}</span></div>
        <div class="stock" data-drop="stock">${stock}</div>
      </div>
      <div class="mat ${locked?'locked':''}">
        <div class="mat-head"><h3>On the bench</h3><span class="mat-note">${p.draft.length ? `${plural(p.draft.length,'flower')}, needs ${min}+` : 'Drag pieces to change the order.'}</span></div>
        <div class="chain-wrap"><div class="chain" data-drop="chain">${chain}</div></div>
        <div class="bench-foot">
          <div class="value-card"><span class="v num">${sc.total}<small> coins</small></span><span class="notes">${notes}</span></div>
          <div class="draft-tools">
            ${ds ? `<button class="btn small" data-act="mv" data-arg="-1" data-key="mvl" aria-label="Move left">◀</button><button class="btn small" data-act="mv" data-arg="1" data-key="mvr" aria-label="Move right">▶</button><button class="btn small" data-act="out" data-key="out">Take out</button>` : ''}
            ${p.draft.length ? `<button class="btn small" data-act="clear" data-key="clr">Clear</button>` : ''}
            <button class="btn small primary" data-act="tie" data-key="tie" ${p.draft.length < min ? 'aria-disabled="true"' : ''}>Tie bouquet</button>
          </div>
        </div>
      </div>
      ${p.bouquets.length ? `<div class="mat ${locked?'locked':''}"><div class="mat-head"><h3>Ready to sell</h3><span class="mat-note">Drag onto a shop slot, or tap then pick a slot.</span></div><div class="tied">${tied}</div></div>` : ''}
    </div>
  </section>`;
}

function signHTML(){
  const h = hint();
  return `<div class="board-sign" role="status" aria-live="polite"><span class="who-turn">${esc(h.who)}</span>${esc(h.t)}${h.sub ? `<span class="sub">${esc(h.sub)}</span>` : ''}</div>`;
}
function marketHTML(me){
  const lock = !me || G.grown || G.pending;
  const cards = G.spread.map((c,i) => {
    const fresh = ui.fresh.has('c' + c.id);
    const sel = ui.sel && ui.sel.kind === 'card' && ui.sel.id === c.id;
    if(c.kind === 'water') return `<button class="card water ${sel?'sel':''}" style="--i:${fresh?i:0};${fresh?'':'animation:none'}" data-act="card" data-arg="${c.id}" data-drag="card:${c.id}" data-key="c${c.id}" aria-label="Water card, ${plural(+G.s.dropsPerWater,'drop')}. Taking water takes two cards.">
        <span class="cn">Water</span><span class="art">${canSVG()}</span><span class="val">${plural(+G.s.dropsPerWater,'drop')} · take two</span></button>`;
    const need = +G.s.water[c.type];
    return `<button class="card ${sel?'sel':''}" style="--tint:${FL[c.type].tint};--i:${fresh?i:0};${fresh?'':'animation:none'}" data-act="card" data-arg="${c.id}" data-drag="card:${c.id}" data-key="c${c.id}" aria-pressed="${!!sel}" aria-label="${FL[c.type].name} seed. Needs ${need} water. Base value ${G.s.base[c.type]}.">
      <span class="cn">${FL[c.type].name}</span><span class="art">${flowerSVG(c.type)}</span>
      <span class="pips" aria-hidden="true">${Array.from({length:need}, () => `<svg viewBox="0 0 20 24"><path d="M10 1 C10 1 2 10.5 2 15.5 a8 8 0 0 0 16 0 C18 10.5 10 1 10 1z" fill="#4A8CC6"/></svg>`).join('')}<span class="val">&nbsp;· ${G.s.base[c.type]}c</span></span></button>`;
  }).join('') || `<span class="empty-note">The market is empty.</span>`;
  const skip = me && !G.grown && !G.pending && !canGrow(cur());
  return `<section class="market" aria-label="Market">
    <div class="sect-head"><h3>Today's market</h3><span class="eyebrow">${plural(G.spread.length,'card')}</span></div>
    <div class="spread ${lock?'':''}" ${lock?'style="opacity:.8"':''}>${cards}</div>
    <div class="decks">
      <span class="deck-pile ${G.deck.length?'':'empty'}" aria-hidden="true"><span></span><span></span><span></span></span>
      <span><b class="num">${G.deck.length}</b> in the growing deck${G.s.win==='deck' ? '' : `<br>${G.discard.length} in the discard`}</span>
      ${skip ? `<button class="btn small" style="margin-left:auto" data-act="skip" data-key="skip">Skip growing</button>` : ''}
    </div>
  </section>`;
}
function trayHTML(){
  const can = G.phase === 'roll' && !ui.rolling && humans().length;
  const res = ui.lastRoll ? `<span class="res">Rolled<b class="num">${ui.lastRoll}</b>${ui.won ? 'Sold!' : G.phase==='turn' ? 'last round' : 'no sale'}</span>` : `<span class="res">Dice tray<b style="font-size:16px;color:var(--cream);font-weight:600">${G.s.rolls > 1 ? `${G.s.rolls} rolls` : 'One roll'} after everyone sets up</b></span>`;
  return `<section class="tray" aria-label="Dice">
    <div class="dice"><span class="die ${ui.tumble?'tumble':''}">${dieSVG(ui.dice[0])}</span><span class="die ${ui.tumble?'tumble':''}">${dieSVG(ui.dice[1])}</span></div>
    <div style="display:grid;gap:8px;justify-items:start">${G.phase === 'roll' ? `<button class="btn gold big" data-act="roll" data-key="roll" ${can?'':'disabled'}>${ui.rolling ? 'Rolling…' : 'Roll the dice'}</button>` : res}</div>
  </section>`;
}
function purseHTML(p){
  const gold = Math.floor(p.coins / 5), silver = p.coins % 5;
  const st = (n,k) => `<span class="stack">${Array.from({length:Math.min(n,8)}, () => coinSVG(k)).join('')}</span>`;
  const stacks = [];
  for(let g=gold; g>0; g-=8) stacks.push(st(Math.min(8,g),'gold'));
  if(silver) stacks.push(st(silver,'silver'));
  return `<section class="purse" aria-label="${esc(p.name)}'s purse" data-purse="${p.id}">

function readSettings(){
  const f = $('#settings-form'); if(!f) return;
  const s = clone(S); const v = (id, lo=0) => { const el = f.querySelector('#'+id); const n = parseInt(el.value,10); return isNaN(n) ? null : Math.max(lo, n); };
  ['startCoins','startSeeds','dropsPerWater','minBouquet','seedsPerType','waterCards','rolls','maxRents','rounds','target'].forEach(k => { const n = v(k); if(n != null) s[k] = n; });
  s.startSeeds = Math.min(8, s.startSeeds); s.minBouquet = Math.max(1, s.minBouquet); s.rolls = Math.max(1, s.rolls); s.rounds = Math.max(1, s.rounds); s.seedsPerType = Math.max(1, s.seedsPerType);
  [2,3,4].forEach(n => { const x = v('spread'+n, 1); if(x != null) s.spread[n] = x; });
  SLOTS.forEach(n => { const x = v('rent-'+n); if(x != null) s.rents[n] = x; });
  KEYS.forEach(k => { const b = v('base-'+k); if(b != null) s.base[k] = b; const w = v('water-'+k, 1); if(w != null) s.water[k] = w; });
  s.unsold = f.querySelector('#unsold').value; s.win = f.querySelector('#win').value;
  S = s; lsSet('flowershop.settings.v1', JSON.stringify(S));
}

/* -------- coin flight -------- */
function flyCoins(slot, ownerId, value){
  if(reduced()) return;
  const from = document.querySelector(`[data-key="slot${slot}"] .bucket`);
  const chips = $$('.pchip'); const to = chips[ownerId];
  if(!from || !to) return;
  const a = from.getBoundingClientRect(), b = to.querySelector('.coins').getBoundingClientRect();
  const n = Math.min(10, Math.max(3, value));
  for(let i=0;i<n;i++){
    const c = document.createElement('div'); c.className = 'flycoin'; c.innerHTML = coinSVG(i%3===2 ? 'silver' : 'gold');
    document.body.appendChild(c);
    const sx = a.left + a.width/2 - 14 + (Math.random()*30-15), sy = a.top + a.height/2 - 14;
    const ex = b.left + b.width/2 - 14, ey = b.top + b.height/2 - 14;
    const mx = (sx+ex)/2 + (Math.random()*120-60), my = Math.min(sy,ey) - 80 - Math.random()*60;
    const anim = c.animate([
      { transform:`translate(${sx}px,${sy}px) scale(.6)`, opacity:0 },
      { transform:`translate(${mx}px,${my}px) scale(1.15) rotate(180deg)`, opacity:1, offset:.45 },
      { transform:`translate(${ex}px,${ey}px) scale(.8) rotate(360deg)`, opacity:1 }
    ], { duration:900 + i*40, delay:i*70, easing:'cubic-bezier(.45,.05,.3,1)', fill:'both' });
    anim.onfinish = () => { c.remove(); if(i % 3 === 0) Snd.coin(); };
  }
}

/* ================= input: taps ================= */
let suppressClick = false;
document.addEventListener('click', e => {
  if(suppressClick){ suppressClick = false; e.preventDefault(); e.stopPropagation(); return; }
  const el = e.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act, arg = el.dataset.arg;
  if(a === 'backdrop'){ if(e.target === el){ ui.modal = null; render(); flow(); } return; }
  if(!a) return;
  handle(a, arg, el);
});
function handle(a, arg, el){
  const me = G && isMyTurn();
  switch(a){
    case 'how': ui.modal = {kind:'how'}; render(); break;
    case 'settings': ui.modal = {kind:'settings'}; render(); break;
    case 'close': ui.modal = null; render(); flow(); break;
    case 'sound': Snd.on = !Snd.on; lsSet('flowershop.sound', Snd.on ? '1' : '0'); if(Snd.on) Snd.bell(); render(); break;
    case 'menu': ui.modal = {kind:'menu'}; render(); break;
    case 'title': ui.modal = null; ui.screen = 'title'; render(); break;
    case 'continue': G = load(); if(G){ ui.screen = 'game'; ui.undo = []; ui.lastHuman = null; ui.viewer = Math.max(0, G.players.findIndex(p => !p.ai)); render(); if(G.phase === 'summary'){ ui.modal = {kind:'summary'}; render(); } flow(); } break;
    case 'setup': ui.screen = 'setup'; render(); break;
    case 'again': ui.screen = 'setup'; render(); break;
    case 'count': ui.setup.count = +arg; render(); break;
    case 'emblem': ui.setup.seats[+el.dataset.seat].emblem = arg; render(); break;
    case 'who': ui.setup.seats[+el.dataset.seat].ai = arg === 'ai'; render(); break;
    case 'start': {
      const seats = ui.setup.seats.slice(0, ui.setup.count);
      newGame(seats); render(); flow(); break;
    }
    case 'resetSettings': S = clone(DEFAULTS); lsSet('flowershop.settings.v1', JSON.stringify(S)); render(); toast('Rules reset to the defaults.'); break;
    case 'ready': ui.modal = null; ui.lastHuman = cur().id; render(); break;
    case 'roll': rollDice(); break;
    case 'next': nextRound(); break;
    case 'undo': if(me) undo(); break;
    case 'end': if(me) endTurn(); break;
    case 'skip': if(me) act(A.skipGrow); break;
    case 'card': {
      if(!me) return toast(G.phase === 'turn' ? 'Wait for your turn.' : 'The market opens next round.', true);
      const c = G.spread.find(c => c.id === +arg); if(!c) return;
      if(G.grown || G.pending) return toast('You have already grown this turn.', true);
      if(c.kind === 'water') return act(A.takeWater, c.id);
      if(!cur().plots.some(pl => !pl.seed)) return toast('Your garden is full. Take water instead.', true);
      ui.sel = ui.sel && ui.sel.id === c.id ? null : { kind:'card', id:c.id };
      const empties = cur().plots.filter(pl => !pl.seed).length;
      if(ui.sel && empties === 1) return act(A.plant, c.id, cur().plots.findIndex(pl => !pl.seed));
      render(); if(ui.sel) toast(`Now tap an empty plot to plant the ${FL[c.type].name.toLowerCase()}.`);
      break;
    }
    case 'plot': {
      const i = +arg; const p = viewP(); const pl = p.plots[i];
      if(me && ui.sel && ui.sel.kind === 'card') return act(A.plant, ui.sel.id, i);
      if(me && G.pending) return act(A.pour, i);
      if(pl.seed) toast(`${FL[pl.seed].name}: ${pl.water} of ${G.s.water[pl.seed]} water.`);
      break;
    }
    case 'stock': if(me) act(A.addDraft, +arg); break;
    case 'draft': if(me){ ui.draftSel = ui.draftSel === +arg ? null : +arg; render(); } break;
    case 'mv': if(me && ui.draftSel != null) act(A.moveDraft, ui.draftSel, +arg); break;
    case 'out': if(me && ui.draftSel != null) act(A.unDraft, ui.draftSel); break;
    case 'clear': if(me) act(A.clearDraft); break;
    case 'tie': if(me) act(A.tie); break;
    case 'untie': if(me) act(A.untie, +arg); break;
    case 'bouquet': if(me){ ui.sel = ui.sel && ui.sel.kind === 'bouquet' && ui.sel.id === +arg ? null : { kind:'bouquet', id:+arg }; render(); if(ui.sel) toast('Now tap an empty shop slot.'); } break;
    case 'slot': {
      const n = +arg, e = G.shop[n];
      if(me && ui.sel && ui.sel.kind === 'bouquet') return askRent(ui.sel.id, n);
      if(e) toast(`${G.players[e.owner].name}'s bouquet in slot ${n} is worth ${e.value}.`);
      else toast(`Slot ${n}: rent ${G.s.rents[n]}, comes up ${WAYS[n]} in 36 rolls.`);
      break;
    }
    case 'confirmRent': { const m = ui.modal; ui.modal = null; act(A.rent, m.bid, m.slot); break; }
  }
}
function askRent(bid, n){
  const p = cur(), rent = +G.s.rents[n];
  if(G.shop[n]){ toast(`Slot ${n} already has a bouquet in it.`, true); Snd.bad(); shakeKey('slot'+n); return; }
  if(p.coins < rent){ toast(`Slot ${n} costs ${rent} coins and you have ${p.coins}.`, true); Snd.bad(); shakeKey('slot'+n); return; }
  if(+G.s.maxRents > 0 && G.rents >= +G.s.maxRents){ toast(`You can rent ${plural(+G.s.maxRents,'slot')} per turn.`, true); return; }
  ui.modal = { kind:'rent', bid, slot:n }; render();
}
function shakeKey(k){ const el = document.querySelector(`[data-key="${k}"]`); if(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); } }

document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.seat != null && t.type === 'text' && ui.setup) ui.setup.seats[+t.dataset.seat].name = t.value;
});
document.addEventListener('submit', e => {
  if(e.target.id === 'settings-form'){ e.preventDefault(); readSettings(); ui.modal = null; render(); toast(ui.screen === 'game' && G ? 'Saved. The new rules apply to your next game.' : 'Rules saved.'); }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && ui.modal && !['curtain','summary'].includes(ui.modal.kind)){ ui.modal = null; render(); flow(); }
  if(e.key === 'Escape' && ui.sel){ ui.sel = null; render(); }
});

/* ================= input: drag and drop ================= */
let drag = null;
function validDrop(spec, target){
  const [k] = spec.split(':'); const [tk, tv] = target.split(':');
  if(k === 'card'){ const c = G.spread.find(c => c.id === +spec.split(':')[1]); const pl = tk === 'plot' && cur().plots[+tv]; if(!c || !pl) return false; return c.kind === 'seed' ? !pl.seed : !!pl.seed; }
  if(k === 'drop') return tk === 'plot' && !!cur().plots[+tv].seed;
  if(k === 'stock') return tk === 'chain' || tk === 'draft';
  if(k === 'draft') return tk === 'chain' || tk === 'draft' || tk === 'stock';
  if(k === 'bouquet') return tk === 'slot' && !G.shop[+tv] && cur().coins >= +G.s.rents[+tv];
  return false;
}
document.addEventListener('pointerdown', e => {
  if(e.button !== 0) return;
  const el = e.target.closest('[data-drag]'); if(!el || !isMyTurn()) return;
  drag = { el, spec:el.dataset.drag, x:e.clientX, y:e.clientY, on:false, ghost:null, over:null };
});
document.addEventListener('pointermove', e => {
  if(!drag) return;
  if(!drag.on){
    if(Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
    drag.on = true;
    const r = drag.el.getBoundingClientRect();
    const g = drag.el.cloneNode(true); g.classList.add('drag-ghost'); g.removeAttribute('data-key'); g.style.width = r.width + 'px'; g.style.height = r.height + 'px'; g.style.animation = 'none';
    document.body.appendChild(g); drag.ghost = g; drag.el.classList.add('dragging');
    $$('[data-drop]').forEach(t => { if(validDrop(drag.spec, t.dataset.drop)) t.classList.add('target'); });
  }
  drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const t = under && under.closest('[data-drop]');
  if(drag.over && drag.over !== t) drag.over.classList.remove('hover');
  drag.over = t && validDrop(drag.spec, t.dataset.drop) ? t : null;
  if(drag.over) drag.over.classList.add('hover');
  e.preventDefault();
}, { passive:false });
function endDrag(e, cancel){
  if(!drag) return;
  const d = drag; drag = null;
  if(!d.on) return;
  suppressClick = true; setTimeout(() => suppressClick = false, 0);
  d.ghost && d.ghost.remove(); d.el.classList.remove('dragging');
  $$('.target,.hover').forEach(t => t.classList.remove('target','hover'));
  if(cancel || !d.over) return;
  const [k, v] = d.spec.split(':'); const [tk, tv] = d.over.dataset.drop.split(':');
  if(k === 'card'){ const c = G.spread.find(c => c.id === +v); if(c.kind === 'seed') act(A.plant, c.id, +tv); else act(A.takeWater, c.id, +tv); }
  else if(k === 'drop') act(A.pour, +tv);
  else if(k === 'stock') act(A.addDraft, +v, tk === 'draft' ? +tv : null);
  else if(k === 'draft'){ if(tk === 'stock') act(A.unDraft, +v); else if(!(tk === 'draft' && +tv === +v)) act(A.addDraft, +v, tk === 'draft' ? +tv : null); }
  else if(k === 'bouquet') askRent(+v, +tv);
}
document.addEventListener('pointerup', e => endDrag(e, false));
document.addEventListener('pointercancel', e => endDrag(e, true));

/* ================= boot ================= */
function start(data){
  if(data && data.G){ G = data.G; ui.screen = data.screen || 'game'; }
  render(); flow();
}
window.claude?.hot?.snapshot?.(() => ({ G, screen: ui.screen === 'setup' ? 'title' : ui.screen }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
window.__fs = { get G(){ return G; }, ui, A, act, handle, endTurn, rollDice, nextRound, newGame, score };
})();
</script>
